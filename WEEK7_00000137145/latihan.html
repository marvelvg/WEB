<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
</head>
<body>

    <h1>Click Event</h1>
    <button id="btnClickEv"> Click Me! </button>
    <div id="clickMsg"></div>

    <h1> Effects </h1>
    <button id="btnHide"> sembunyikan </button>
    <button id="btnShow"> Tampilkan </button>
    <div id="hideShowMMsg"> SOMETHING SOMETHING </div>

    <h1> Get Value From Input </h1>
    <input type="text" id="inputVal" />
    <button id="btnGetVal"> Get Value </button>
    <div id="showVal"></div>

    <h1>Add Children</h1>
    <button id="ortu"></button>
    <div id="ortu"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous">
    </script>
<script>

    ("btnMelahirkan").click(function(){
         $("#ortu").append("<div style='background: deeppink; margin:2px;'>anak</div>");
    });
    
    $("#btnClickEv").click(function(){
        $("#clickMsg").text("Button above me is clicked.");
    });

    $("#btnHide").click(function(){
        $("#hideShowMMsg").fadeOut();
    });
    $("#btnShow").click(function(){
        $("#hideShowMMsg").fadeIn();
    });

    $('#btnGetVal').click(function(){
        val = $("#inputVal").val();
        $("#showVal").text(val);
    });
</script>

</body>
</html>
