<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilangan Prima </title>
</head>
<body>
<script>

angka = window.prompt("Input angka = ");
    for (let i = 2; i <= angka; i++) {
        
        let prima = true;

        for (let j = 2; j < i; j++) {
            if (i % j === 0) {
                prima = false;
                break;
            }
        }

        if (prima) {
            document.write(i + " ");
        }
    }
</script>

</body>
</html>
