<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Data Ganjil</title>
</head>
<body>
    <script>
        DataGanjil = window.prompt("Input nomor Ganjil = ");

        if((DataGanjil % 2) === 0){
            document.write("Bukan data ganjillllllllllllllll");
        }

        else{
            for(i=1; i<=DataGanjil; i+=2){
                document.write(i + " ");
            }
        }
    </script>
</body>
</html>
