<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 6</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .skills {
            list-style: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 id="name">Yogi Ananta</h1>
        <p class="description"><strong>Programmer</strong> in Training</p>
        <ul class="skills p-0 d-flex gap-4" id="skills">
            <li class="py-2 px-4 bg-primary rounded text-white">HTML</li>
            <li class="py-2 px-4 bg-primary rounded text-white">CSS</li>
            <li class="py-2 px-4 bg-primary rounded text-white">Javascript</li>
        </ul>
        <div class="col-4">
            <button id="addskill" class="btn btn-primary w-100">Add Skill</button>
        </div>
    </div>

    <script>
        const description = document.querySelector('.description');
        const skills = document.getElementById('skills');
        const skill = skills.getElementsByTagName('li')[2];


        const addskill = document.getElementById('addskill');
        addskill.addEventListener('click', () => {
            const li = skill.cloneNode(true);
            li.textContent = "C++";
            skills.append(li);
        });
    </script>
</body>

</html>
