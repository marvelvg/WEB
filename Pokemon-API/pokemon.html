<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body class="p-4">
    <div class="container">
        <div class="d-flex typelist gap-2 mb-2">
          
        </div>
        <div class="row pokelist g-4">
          
        </div>
    </div>
    <script>
        const url = "https://pokeapi.co/api/v2/pokemon?limit=20&offset=0";
        const pokelist = document.querySelector('.pokelist');
        const typelist = document.querySelector('.typelist');

        async function fetchPokemon() {
            const response = await fetch(url);
            const data = await response.json();
            // console.log(data);

            const listPokemon = await Promise.all(data.results.map(async (pokemon) => {
                const response = await fetch(pokemon.url);
                const data = await response.json();
                return data;
            }));

            const uniqueType = ["all", ...new Set(listPokemon.flatMap(pokemon => {
                return  pokemon.types.map(t => t.type.name);
            }))].sort();

            typelist.innerHTML = uniqueType.map(type => {
                
                return `
                      <button class="btn ${type == "all" ? "btn-primary" : "btn-outline-primary"} py-2 px-4 text-capitalize">${type}</button>
                `;
            }).join("");
            

            console.log(uniqueType);

            pokelist.innerHTML =  listPokemon.map(pokemon => {
                console.log();
                const types = pokemon.types.map(t => {
                    return `
                        <span class="badge rounded-pill text-bg-secondary text-capitalize">${t.type.name}</span>
                    `;
                }).join("");

                return `
                  <div class="col-md-3">
                    <div class="pokemon card">
                        <img src="${pokemon.sprites.other["official-artwork"].front_default}" alt="${pokemon.name}" class="card-img-top">
                        <div class="card-body">
                            <h5 class="card-title">${pokemon.name}</h5>
                            <p class="card-content">${types}</p>
                        </div>
                    </div>
                </div>
                `;
            }).join("");
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchPokemon();
        })

    </script>
</body>

</html>
